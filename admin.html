<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VRWS - Admin Control Dashboard</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body { background-color: #0b0f19; color: #f8fafc; padding: 20px; }
        .admin-box { max-width: 600px; margin: 40px auto; background: #1e293b; padding: 35px; border-radius: 10px; border-top: 5px solid #f59e0b; box-shadow: 0 15px 25px rgba(0,0,0,0.5); }
        h2 { text-align: center; color: #f59e0b; margin-bottom: 25px; font-size: 22px; }
        .form-control { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-size: 13px; color: #cbd5e1; font-weight: 500; }
        input, textarea { width: 100%; padding: 12px; border: 1px solid #475569; border-radius: 6px; background: #0f172a; color: white; font-size: 14px; }
        .save-btn { background: #f59e0b; color: #0b0f19; padding: 12px; border: none; border-radius: 6px; cursor: pointer; font-size: 15px; width: 100%; font-weight: bold; transition: 0.3s; }
        .save-btn:hover { background: #d97706; }
        .back-btn { display: block; text-align: center; margin-top: 20px; color: #94a3b8; text-decoration: none; font-size: 13px; }
        .back-btn:hover { color: white; }
    </style>
</head>
<body>

    <div class="admin-box">
        <h2>VRWS Secure Admin Panel</h2>
        <form>
            <div class="form-control">
                <label>Update Social Media / Facebook Links:</label>
                <input type="text" placeholder="Paste link here...">
            </div>

            <div class="form-control">
                <label>Add / Manage Leadership Members:</label>
                <input type="text" placeholder="Enter name and title...">
            </div>

            <div class="form-control">
                <label>Upload Recent Work, Event Details & Media Links:</label>
                <textarea rows="4" placeholder="Write description and paste photo/video links..."></textarea>
            </div>

            <button type="button" class="save-btn" onclick="alert('Changes saved successfully!')">Update Website</button>
        </form>
        
        <a href="index.html" class="back-btn">← Back to Live Website</a>
    </div>

</body>
</html>
