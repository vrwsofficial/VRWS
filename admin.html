<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VRWS - Secure Admin Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: #f1f5f9; color: #334155; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .admin-card { background: #ffffff; width: 100%; max-width: 600px; padding: 40px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); border-top: 4px solid #d97706; }
        h2 { color: #0f172a; margin-bottom: 25px; font-size: 20px; font-weight: 700; text-align: center; }
        .form-section { background: #f8fafc; border: 1px solid #e2e8f0; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        .form-section h3 { font-size: 15px; color: #0284c7; margin-bottom: 12px; font-weight: 700; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 6px; font-size: 12px; font-weight: 600; color: #475569; }
        input, textarea { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 13px; background: #ffffff; color: #0f172a; }
        input:focus, textarea:focus { outline: none; border-color: #0284c7; }
        .submit-btn { background: #0284c7; color: white; border: none; padding: 12px; width: 100%; border-radius: 6px; font-weight: 600; font-size: 14px; cursor: pointer; transition: 0.2s; }
        .submit-btn:hover { background: #0369a1; }
        .back-link { display: block; text-align: center; margin-top: 20px; color: #64748b; text-decoration: none; font-size: 13px; font-weight: 500; }
        #dashboard { display: none; }
    </style>
</head>
<body>

    <div class="admin-card">
        <!-- 1. Login Section -->
        <div id="loginSection">
            <h2>Admin Secure Login</h2>
            <div class="form-group">
                <label>Admin Email:</label>
                <input type="email" id="adminEmail" placeholder="admin@vrws.org">
            </div>
            <div class="form-group">
                <label>Password:</label>
                <input type="password" id="adminPassword" placeholder="Enter secure password">
            </div>
            <button type="button" class="submit-btn" id="loginBtn">Login to Panel</button>
            <a href="index.html" class="back-link">&larr; Back to Public Website</a>
        </div>

        <!-- 2. Dashboard Section (After Login) -->
        <div id="dashboard">
            <h2>VRWS Content Management</h2>
            
            <div class="form-section">
                <h3>Add Leadership Member</h3>
                <div class="form-group">
                    <label>Full Name:</label>
                    <input type="text" id="leaderName" placeholder="e.g. Rimas Khan">
                </div>
                <div class="form-group">
                    <label>Position / Designation:</label>
                    <input type="text" id="leaderPos" placeholder="e.g. Founder & Executive Director">
                </div>
                <div class="form-group">
                    <label>Contact Info (Email/Phone):</label>
                    <input type="text" id="leaderContact" placeholder="voiceofrohingyawomenandstudent@gmail.com">
                </div>
                <div class="form-group">
                    <label>Profile Image URL/Filename:</label>
                    <input type="text" id="leaderImg" placeholder="FB_IMG_1789302172737.jpg">
                </div>
                <button type="button" class="submit-btn" id="addLeaderBtn">Save Leader</button>
            </div>

            <div class="form-section">
                <h3>Add Recent Work & Gallery</h3>
                <div class="form-group">
                    <label>Work Title:</label>
                    <input type="text" id="workTitle" placeholder="Event Title...">
                </div>
                <div class="form-group">
                    <label>Description:</label>
                    <textarea id="workDesc" rows="3" placeholder="Write description..."></textarea>
                </div>
                <div class="form-group">
                    <label>Gallery Image Links (Comma separated):</label>
                    <textarea id="workImgs" rows="2" placeholder="img1.jpg, img2.jpg, img3.jpg"></textarea>
                </div>
                <button type="button" class="submit-btn" id="addWorkBtn">Publish Work</button>
            </div>

            <button type="button" class="submit-btn" style="background:#b91c1c;" id="logoutBtn">Logout</button>
            <a href="index.html" class="back-link">&larr; View Public Website</a>
        </div>
    </div>

    <!-- Firebase Auth & Firestore Script with Timestamp for Sorting -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyDXiahQ2VrNeOJxDwNA5Qsd3-S2U60cAo4",
          authDomain: "vrws-19987.firebaseapp.com",
          projectId: "vrws-19987",
          storageBucket: "vrws-19987.firebasestorage.app",
          messagingSenderId: "418381310085",
          appId: "1:418381310085:web:2d9f18a47bb656af8a61ec"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        document.getElementById('loginBtn').addEventListener('click', async () => {
            const email = document.getElementById('adminEmail').value;
            const pass = document.getElementById('adminPassword').value;
            try {
                await signInWithEmailAndPassword(auth, email, pass);
                alert('Login Successful!');
            } catch (error) {
                alert('Login Failed: ' + error.message);
            }
        });

        document.getElementById('logoutBtn').addEventListener('click', async () => {
            await signOut(auth);
            alert('Logged out successfully.');
        });

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('loginSection').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';
            } else {
                document.getElementById('loginSection').style.display = 'block';
                document.getElementById('dashboard').style.display = 'none';
            }
        });

        // Add Leader with serverTimestamp for precise ordering
        document.getElementById('addLeaderBtn').addEventListener('click', async () => {
            try {
                await addDoc(collection(db, "leaders"), {
                    name: document.getElementById('leaderName').value,
                    position: document.getElementById('leaderPos').value,
                    contact: document.getElementById('leaderContact').value,
                    image: document.getElementById('leaderImg').value,
                    createdAt: serverTimestamp() // সিরিয়াল মেইনটেইন করার জন্য এটি যুক্ত করা হয়েছে
                });
                alert('Leader added successfully!');
                // ফর্ম রিসেট করা
                document.getElementById('leaderName').value = '';
                document.getElementById('leaderPos').value = '';
                document.getElementById('leaderContact').value = '';
                document.getElementById('leaderImg').value = '';
            } catch (e) { alert('Error: ' + e.message); }
        });

        // Add Work with serverTimestamp for precise ordering
        document.getElementById('addWorkBtn').addEventListener('click', async () => {
            try {
                await addDoc(collection(db, "works"), {
                    title: document.getElementById('workTitle').value,
                    description: document.getElementById('workDesc').value,
                    images: document.getElementById('workImgs').value,
                    createdAt: serverTimestamp() // সিরিয়াল মেইনটেইন করার জন্য এটি যুক্ত করা হয়েছে
                });
                alert('Work published successfully!');
                // ফর্ম রিসেট করা
                document.getElementById('workTitle').value = '';
                document.getElementById('workDesc').value = '';
                document.getElementById('workImgs').value = '';
            } catch (e) { alert('Error: ' + e.message); }
        });
    </script>
</body>
</html>
